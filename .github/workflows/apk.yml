name: Build tablet APK
on:
  pull_request:
  push:
    branches: [main, feat/dark1-live-screen-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DARK1-MIRROR-TABLET_v1.0-comp.1.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DARK1-MIRROR-TABLET_v1.0-comp.1
          path: dist/
